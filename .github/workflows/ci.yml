name: CI
on:
  push:
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck && luarocks install busted
      - run: luacheck .
      - run: bash tools/fetch-libs.sh
      - run: busted

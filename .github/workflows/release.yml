# Pushing a version tag (v1.0.0, ...) packages RaidControl and uploads it to CurseForge.
# Needs the repository secret CF_API_KEY and ## X-Curse-Project-ID in RaidControl.toc
# (add WAGO_API_TOKEN and ## X-Wago-ID to publish on Wago too).
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
